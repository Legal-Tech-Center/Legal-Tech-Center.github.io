{% assign lang = page.lang | default: "de" %}
<!-- Organization Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResearchOrganization",
  "@id": "{{ site.url }}/#organization",
  "name": "Legal Tech Center",
  "legalName": "Legal Tech Center LTC UG (haftungsbeschränkt)",
  "url": "{{ site.url }}",
  "logo": {
    "@type": "ImageObject",
    "url": "{{ site.url }}/assets/images/logo.png"
  },
  "image": "{{ site.url }}/assets/images/og-image-{% if lang == 'en' %}en{% else %}de{% endif %}.png",
  "email": "info@legaltech.center",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Köpenicker Str. 145",
    "addressLocality": "Berlin",
    "postalCode": "10997",
    "addressCountry": "DE"
  },
  "sameAs": [
    "https://www.linkedin.com/company/legal-tech-center"
  ],
  "foundingDate": "2015",
  "knowsAbout": ["Law", "Artificial intelligence", "Legal informatics"],
  "description": "{% if lang == 'en' %}Legal Tech Center is a Berlin research lab at the intersection of law and artificial intelligence.{% else %}Das Legal Tech Center ist ein Forschungslabor in Berlin an der Schnittstelle von Recht und künstlicher Intelligenz.{% endif %}"
}
</script>

<!-- WebSite Schema -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": "{{ site.url }}/#website",
  "name": "Legal Tech Center",
  "url": "{{ site.url }}",
  "publisher": {
    "@id": "{{ site.url }}/#organization"
  },
  "inLanguage": ["de", "en"]
}
</script>
