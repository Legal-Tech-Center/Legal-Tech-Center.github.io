{% assign lang = page.lang | default: "de" %}
{% assign t = site.data.i18n[lang] %}
<footer class="colophon row">
  <div class="colophon-inner col-text">
    <p>&copy; {{ 'now' | date: '%Y' }} {{ t.impressum.company }}</p>
    <nav>
      <a href="{{ t.footer.imprint_url | relative_url }}">{{ t.impressum.title }}</a>
    </nav>
  </div>
</footer>
