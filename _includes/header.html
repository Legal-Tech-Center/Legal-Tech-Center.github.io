{% assign lang = page.lang | default: "de" %}
{% assign t = site.data.i18n[lang] %}
<header class="masthead row">
  <!-- Logo mark, redrawn from logo.png. The logo's vertical bar is the page rule drawn in style.css -->
  <svg class="mark" viewBox="0 0 965 1197" aria-hidden="true" focusable="false">
    <path d="M0 237H423V715H300V359H0Z M0 481H123V837H423V960H0Z M545 237H723V359H545Z M545 837H723V960H545Z"/>
  </svg>
  <div class="masthead-end col-text">
    <a class="wordmark-link" href="{% if lang == 'en' %}/en/{% else %}/{% endif %}">
      <img class="wordmark" src="{{ '/assets/images/wordmark.png' | relative_url }}" width="800" height="390" alt="Legal Tech Center">
    </a>
    <a class="lang-switch" href="{{ page.translation | relative_url }}" hreflang="{{ t.language.switch_lang }}" lang="{{ t.language.switch_lang }}">{{ t.language.switch_label }}</a>
  </div>
</header>
