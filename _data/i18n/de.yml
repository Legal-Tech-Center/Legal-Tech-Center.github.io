home:
  headline: "Forschungslabor für Recht und künstliche Intelligenz"
  rn_label: "Randnummer"
  paragraphs:
    - "Das Legal Tech Center ist ein Forschungslabor in Berlin. Wir untersuchen, was sich verändert, wenn Maschinen juristisch arbeiten, und was das Recht im Gegenzug von ihnen verlangt."
    - "Uns beschäftigen Fragen wie diese: Wie gehen Sprachmodelle mit Normen und Urteilen um? Wann ist eine maschinelle Rechtsauskunft verlässlich, und wie lässt sich das überprüfen? Was ändern KI-Agenten an der Arbeit von Kanzleien, Rechtsabteilungen, Gerichten und Verwaltung? Und wie reguliert man Systeme, die selbst Recht anwenden?"
    - "Wir arbeiten mit Menschen aus Rechtspraxis, Rechtswissenschaft und Informatik zusammen, die diese Fragen an echten Fällen untersuchen."
    - "Mehr dazu bald an dieser Stelle. Bis dahin erreichen Sie uns unter <a href=\"mailto:info@legaltech.center\">info@legaltech.center</a>."

