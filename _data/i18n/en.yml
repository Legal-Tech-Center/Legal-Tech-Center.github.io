home:
  headline: "A research lab for law and artificial intelligence"
  rn_label: "Paragraph"
  paragraphs:
    - "Legal Tech Center is a research lab in Berlin. We study what changes when machines do legal work, and what the law asks of them in return."
    - "Some of the questions we work on: How do language models handle statutes and case law? When is machine-generated legal advice reliable, and how can anyone check? What do AI agents change about the work of law firms, legal departments, courts and public administration? And how do you regulate systems that apply the law themselves?"
    - "We work with people from legal practice, legal scholarship and computer science who test these questions against real cases."
    - "More on this soon. Until then, you can reach us at <a href=\"mailto:info@legaltech.center\">info@legaltech.center</a>."

